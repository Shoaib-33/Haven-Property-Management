# Render blueprint for a public DEMO (free plan: data is reset whenever the service restarts).
services:
  - type: web
    name: haven-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HAVEN_DEMO_SEED
        value: "1"
      - key: HAVEN_SECURE_COOKIES
        value: "1"
      - key: HAVEN_DATA_DIR
        value: /data
      - key: HAVEN_PUBLIC_URL
        sync: false          # paste your https://....onrender.com address after the first deploy
      - key: HAVEN_DEMO_PASSWORD
        sync: false          # REQUIRED for a public demo: the password of every demo login (12+ characters, your own choice)
      - key: GROQ_API_KEY
        sync: false          # optional: turns the Help chat into the AI assistant (free key from console.groq.com)
      - key: HAVEN_GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false          # optional fallback for the Help chat
